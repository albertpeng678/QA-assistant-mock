<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>法規 RAG 問答 — 企業法遵研究助理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<!-- markdown 渲染：marked 解析 + DOMPurify 淨化（防 XSS） -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<style>
  :root{
    /* 設計系統「Airy Glass」token（取代原 editorial 三色；變數名沿用，元件零改）。
       唯一視覺真相為 design-system.md，僅引用其 oklch token，不寫死字面值。 */
    --ink:oklch(0.225 0.018 262);     /* 主文字：墨黑帶 navy（§14 foreground） */
    --paper:oklch(0.992 0.004 95);    /* 全站底：暖紙白（§14 background） */
    --blood:oklch(0.325 0.10 262);    /* 強調主色：navy（§14 primary，取代原朱紅） */
    --brand-accent:oklch(0.665 0.105 200); /* 品牌 teal（§14 brand-accent，克制使用 ≤2/頁） */
    /* navy alpha 階梯（沿用原命名與透明度，僅換色相為 navy-foreground） */
    --ink-90:oklch(0.225 0.018 262 / 0.90); --ink-70:oklch(0.225 0.018 262 / 0.70); --ink-50:oklch(0.225 0.018 262 / 0.60);
    --ink-35:oklch(0.225 0.018 262 / 0.35); --ink-20:oklch(0.225 0.018 262 / 0.20); --ink-12:oklch(0.225 0.018 262 / 0.12); --ink-08:oklch(0.225 0.018 262 / 0.08);
    /* 卡片/列底：白卡，靠 border + 淡 navy 陰影分層（§11 Card） */
    --surface:oklch(1 0 0);
    /* 玻璃功能層（§1 Translucency：只用在 app bar / composer / 浮層；單層小面積） */
    --glass:oklch(1 0 0 / 0.62);
    --glass-border:oklch(0.325 0.10 262 / 0.10);
    --shadow-sm:0 1px 2px oklch(0.225 0.018 262 / 0.08), 0 1px 3px oklch(0.225 0.018 262 / 0.06);
    --shadow-lg:6px 0 30px oklch(0.225 0.018 262 / 0.15);
  }
  *{ box-sizing:border-box; }
  /* 消除手機/平板橡皮筋：app shell 釘住視口、禁 overscroll、動態視口高度（dvh fallback 先寫舊值） */
  html,body{
    margin:0;
    height:100%;        /* 舊瀏覽器 fallback */
    height:100vh;       /* fallback */
    height:100dvh;      /* 動態視口：處理手機瀏覽器工具列縮放 */
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    background-color:var(--paper); color:var(--ink); font-family:'Spline Sans',system-ui,sans-serif;
    /* §1 呼吸：極淡 navy/teal 氛圍漸層，作為毛玻璃折射的底（非裝飾花底） */
    background-image:
      radial-gradient(at 10% 0%, oklch(0.325 0.10 262 / 0.06) 0, transparent 45%),
      radial-gradient(at 90% 2%, oklch(0.665 0.105 200 / 0.05) 0, transparent 42%);
  }
  .font-display{ font-family:'Hanken Grotesk',serif; }
  .font-body{ font-family:'Spline Sans',serif; }

  /* —— 答案 markdown 排版：行距、段落留白、巢狀縮排 —— */
  .answer-prose{ font-family:'Spline Sans',serif; font-size:16px; line-height:1.85; color:var(--ink); }
  .answer-prose > *+*{ margin-top:.85em; }
  .answer-prose p{ margin:0; }
  .answer-prose ul,.answer-prose ol{ margin:.4em 0; padding-left:1.5em; }
  .answer-prose ul{ list-style:disc; } .answer-prose ol{ list-style:decimal; }
  .answer-prose li{ margin:.3em 0; padding-left:.15em; }
  .answer-prose li > ul,.answer-prose li > ol{ margin:.3em 0; }
  /* markdown 語意配色：H2 血紅主結構、H3 深墨次標題（context7/marked：以元素上色）*/
  .answer-prose h1,.answer-prose h2,.answer-prose h3{ font-family:'Hanken Grotesk',serif; font-weight:600; line-height:1.35; margin:.6em 0 .2em; }
  .answer-prose h2{ color:var(--blood); }
  .answer-prose h3{ font-size:1.05em; color:var(--ink-90); }
  .answer-prose strong{ font-weight:600; color:var(--ink); }
  .answer-prose code{ font-family:ui-monospace,monospace; font-size:.9em; background:var(--ink-08); color:var(--blood); padding:.1em .35em; border-radius:4px; }
  /* caveat / 引言：軟盒（淡底細框圓角，無左槓鑲邊） */
  .answer-prose blockquote{ background:oklch(0.325 0.10 262 / 0.04); border:1px solid var(--ink-12); border-radius:10px; padding:10px 13px; color:var(--ink-70); margin:1em 0 0; }
  /* 確定性層級 badge（Layer-0，填色 chip） */
  .tier-badge{ display:inline-flex; align-items:center; font-family:'Spline Sans'; font-size:12px; font-weight:700; color:var(--paper); border-radius:12px; padding:3px 11px; margin-bottom:8px; }
  .tier-badge.tier-explicit{ background:var(--blood); }   /* 明文：朱紅（產品主色） */
  .tier-badge.tier-interpret{ background:#2e5a52; }
  .tier-badge.tier-practice{ background:#8a5a12; }
  .tier-badge.tier-gap{ background:var(--ink-50); }
  .answer-prose sup a{ color:var(--blood); font-weight:700; text-decoration:none; font-size:.7em; padding:0 1px; }
  .cite-ref:focus-visible{ outline:2px solid var(--blood); outline-offset:2px; border-radius:3px; }

  /* —— 缺口③：表格平滑渲染 + 表格樣式 —— */
  .answer-prose table{ border-collapse:collapse; width:100%; margin:.6em 0; font-size:.92em; }
  .answer-prose th,.answer-prose td{ border:1px solid var(--ink-20); padding:.4em .6em; text-align:left; vertical-align:top; }
  .answer-prose thead th{ background:var(--ink-08); font-family:'Spline Sans'; font-weight:700; }
  .answer-prose tbody tr:nth-child(even){ background:oklch(0.225 0.018 262 / 0.04); }
  /* 串流中尚未成形的尾段：以淡墨純文字暫顯，避免閃現 markdown 原始符號 */
  .md-pending{ color:var(--ink-35); white-space:pre-wrap; }

  /* —— 缺口⑤：保留法條原始換行/縮排結構 —— */
  .legal-pre{ white-space:pre-wrap; word-break:break-word; }
  /* 證據卡摘要夾制：同檔合併 top-2 chunk 後判決 snippet 可達數千字，預設只露 8 行、
     底部淡出，全文靠「展開原文全文」——否則卡片形同預設攤開全文。 */
  .evi-snippet{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:8;
                overflow:hidden; position:relative; }

  /* —— 缺口⑦：確定性層級標籤（填色 chip：墨／teal／amber／灰，2 低飽和輔色經使用者核可）—— */
  .tier{ display:inline-block; font-family:'Spline Sans'; font-size:.74em; font-weight:700;
         padding:.1em .6em; border-radius:11px; margin-right:.35em; color:var(--paper); }
  .tier-explicit{ background:var(--blood); }     /* 明文：朱紅（與 Layer-0 badge 一致） */
  .tier-interpret{ background:#2e5a52; }          /* 解釋/裁量：teal */
  .tier-practice{ background:#8a5a12; }           /* 實務見解：amber */
  .tier-gap{ background:var(--ink-50); }          /* 語料未涵蓋：灰 */

  /* —— 串流游標 —— */
  .stream-caret::after{ content:'▍'; color:var(--blood); animation:blink 1s steps(2) infinite; margin-left:1px; }
  @keyframes blink{ 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

  /* —— 等待狀態（NN/g：階段步驟列＋答案形骨架；>12s 安撫＋停止）—— */
  .wait-stage{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-35); font-weight:500; }
  .wait-stage .st-ic{ width:15px; height:15px; border-radius:50%; border:1.5px solid var(--ink-20);
                      flex:none; display:flex; align-items:center; justify-content:center; font-size:9px; }
  .wait-stage.done{ color:var(--ink-70); }
  .wait-stage.done .st-ic{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .wait-stage.now{ color:var(--blood); font-weight:700; }
  .wait-stage.now .st-ic{ border-color:var(--blood); }
  .wait-stage.now .st-ic::after{ content:''; width:5px; height:5px; border-radius:50%; background:var(--blood);
                                 animation:waitpulse 1.1s ease-in-out infinite; }
  @keyframes waitpulse{ 0%,100%{opacity:.25; transform:scale(.7)} 50%{opacity:1; transform:scale(1)} }
  .sk{ background:linear-gradient(90deg,var(--ink-08) 25%, oklch(0.225 0.018 262 / 0.15) 37%, var(--ink-08) 63%);
       background-size:400% 100%; animation:skshim 1.6s ease infinite; border-radius:6px; }
  @keyframes skshim{ 0%{background-position:100% 0} 100%{background-position:0 0} }
  .wait-reassure{ font-size:12px; color:var(--ink-50); background:oklch(0.325 0.10 262 / 0.04); border:1px solid var(--ink-12);
                  border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:8px; }
  .wait-stop{ font-size:11px; font-weight:700; color:var(--blood); border:1px solid oklch(0.325 0.10 262 / 0.33);
              border-radius:8px; padding:2px 10px; margin-left:auto; flex:none; cursor:pointer; }
  .wait-stop:hover{ background:oklch(0.325 0.10 262 / 0.08); }

  /* —— offcanvas —— */
  #scrim{ position:fixed; inset:0; background:oklch(0.225 0.018 262 / 0.40); opacity:0; pointer-events:none; transition:opacity .25s; z-index:40; }
  #scrim.open{ opacity:1; pointer-events:auto; }
  #offcanvas{ position:fixed; top:0; left:0; bottom:0; width:340px; max-width:86vw; background:var(--surface);
              border-right:1px solid var(--ink-12); box-shadow:var(--shadow-lg);
              transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1); z-index:50;
              display:flex; flex-direction:column; }
  #offcanvas.open{ transform:translateX(0); }
  .evi-card{ background:var(--surface); border:1px solid var(--ink-12); border-radius:9px; padding:13px; box-shadow:var(--shadow-sm); }
  .evi-card.active{ border-color:oklch(0.325 0.10 262 / 0.40); box-shadow:0 0 0 2px oklch(0.325 0.10 262 / 0.10); }

  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid oklch(0.325 0.10 262 / 0.27);
         color:var(--blood); border-radius:16px; padding:6px 13px; font-size:13px; cursor:pointer;
         transition:background .15s,transform .1s; font-family:'Spline Sans'; box-shadow:var(--shadow-sm); }
  .chip:hover{ background:oklch(0.325 0.10 262 / 0.05); } .chip:active{ transform:scale(.97); }

  /* 空狀態方向2：領域 tag + 範例題 */
  .dom-tag{ font-family:'Spline Sans'; font-size:13px; font-weight:600; border:1px solid var(--ink-20);
            color:var(--ink-70); border-radius:14px; padding:6px 13px; background:var(--surface); cursor:pointer; transition:all .15s; }
  .dom-tag:hover{ border-color:oklch(0.325 0.10 262 / 0.33); } .dom-tag.on{ border-color:var(--blood); color:var(--blood); background:oklch(0.325 0.10 262 / 0.05); }
  .exq{ font-family:'Spline Sans',serif; font-size:13px; color:var(--ink); border:1px solid oklch(0.325 0.10 262 / 0.20); border-radius:10px;
        padding:10px 12px; background:var(--surface); box-shadow:var(--shadow-sm); cursor:pointer; transition:border-color .15s; line-height:1.5; }
  .exq:hover{ border-color:oklch(0.325 0.10 262 / 0.40); }

  .src-row{ display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--ink-12);
            border-radius:8px; padding:8px 12px; cursor:pointer; transition:border-color .15s; box-shadow:var(--shadow-sm); }
  .src-row:hover{ border-color:oklch(0.325 0.10 262 / 0.33); }
  .src-row:focus-visible{ outline:2px solid var(--blood); outline-offset:2px; }

  .fb-btn{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
           border-radius:7px; border:1px solid var(--ink-12); background:var(--surface); cursor:pointer; color:var(--ink-50); transition:all .15s; }
  .fb-btn:hover{ border-color:oklch(0.325 0.10 262 / 0.33); color:var(--blood); }
  .fb-btn.active{ background:var(--blood); color:var(--paper); border-color:var(--blood); }

  /* 深色頂列上的按鈕 hover：紙白半透明（嚴守三色，不引入純白） */
  .bar-btn{ transition:background .15s; } .bar-btn:hover{ background:var(--ink-08); }
  .icon-sm{ width:15px; height:15px; } .icon-xs{ width:13px; height:13px; }
  ::-webkit-scrollbar{ width:9px; } ::-webkit-scrollbar-thumb{ background:var(--ink-20); border-radius:5px; }

  /* —— 真正的捲動容器：阻斷捲動鏈傳到 body（消除橡皮筋）+ iOS 慣性順滑 —— */
  main{ overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  /* offcanvas 內捲動區：抽屜捲動時不彈到底層 */
  #oc-body{ overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
</style>
</head>
<body class="flex flex-col">

  <!-- 頂列：左側 hamburger（與 offcanvas 同側）+ 品牌 -->
  <header class="flex items-center gap-3 px-4 py-3 text-[var(--ink)]" style="background:var(--glass); border-bottom:1px solid var(--glass-border); -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%)">
    <button id="ham" aria-label="開啟引證依據" class="bar-btn relative inline-flex items-center justify-center w-9 h-9 rounded-lg">
      <i data-lucide="menu" class="w-5 h-5"></i>
      <span id="ham-count" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-lg text-[10px] font-bold items-center justify-center" style="background:var(--brand-accent)"></span>
    </button>
    <i data-lucide="scale" class="w-4 h-4 opacity-85"></i>
    <h1 class="font-display font-semibold text-[15px] tracking-tight">法遵研究助理</h1>
    <span class="flex-1"></span>
    <button id="new-chat" aria-label="新對話" class="bar-btn inline-flex items-center justify-center w-9 h-9 rounded-lg opacity-80">
      <i data-lucide="square-pen" class="w-4 h-4"></i>
    </button>
  </header>

  <!-- 對話區 -->
  <main class="flex-1 overflow-y-auto">
    <div id="thread" class="max-w-3xl mx-auto px-4 py-6 space-y-5"></div>
  </main>

  <!-- 輸入區 + disclaimer -->
  <footer class="border-t px-4 py-3" style="border-color:var(--ink-12); background:var(--paper)">
    <form id="ask-form" class="max-w-3xl mx-auto">
      <div class="flex items-center gap-2 rounded-xl px-3 py-2 border" style="background:var(--surface); border-color:var(--ink-20)">
        <input id="q" autocomplete="off" aria-label="輸入法遵問題" class="flex-1 bg-transparent outline-none font-body text-[15px] px-1 py-1"
               placeholder="輸入你的法遵問題…" />
        <button type="submit" id="send" aria-label="送出"
                class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-[var(--paper)] transition disabled:opacity-40" style="background:var(--ink)">
          <i data-lucide="arrow-up" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="flex items-center justify-center gap-1.5 mt-2 text-[11px]" style="color:var(--blood)">
        <i data-lucide="alert-triangle" class="icon-xs"></i>
        本工具協助研究，非法律意見，請核對條文原文
      </p>
    </form>
  </footer>

  <!-- 左側 offcanvas：引證依據 -->
  <div id="scrim"></div>
  <aside id="offcanvas" role="dialog" aria-modal="true" aria-label="引證依據">
    <div class="flex items-center gap-2 px-4 py-4 border-b" style="border-color:var(--ink-12)">
      <i data-lucide="file-search" class="icon-sm" style="color:var(--blood)"></i>
      <span class="font-display font-semibold text-[14px] flex-1">引證依據</span>
      <button id="oc-close" aria-label="關閉" class="text-[var(--ink-50)] hover:text-[var(--blood)]"><i data-lucide="x" class="icon-sm"></i></button>
    </div>
    <div id="oc-body" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>
  </aside>

<script>
const STARTERS = [
  "個資外洩要通報誰？期限多久？",
  "洗錢防制的客戶盡職調查（KYC）要做到什麼程度？",
  "公司內線交易的重大消息何時才可買賣股票？",
];
const state = { previousResponseId: null, lastEvidence: [], answering: false };
const thread = document.getElementById("thread");
// 把 [^N] 腳註標記轉成可點上標引用（點擊開引證 offcanvas）
const footnotes = (html) => html.replace(/\[\^(\d+)\]/g,
  '<sup><a href="#" class="cite-ref" data-ref="$1">$1</a></sup>');
// 剝除 gpt-5.4-mini 的 inline 引用標記（U+E200–E20F 私用區字元 + turnXfileY token），避免漏進答案
const stripCite = (t) => (t || "").replace(/\ue200[\s\S]*?\ue201/g, "");
// 缺口⑦：把確定性層級標籤 【明文】【解釋/裁量】【實務見解】【語料未涵蓋】 包成樣式 chip
const TIER_CLASS = { "明文":"tier-explicit", "解釋/裁量":"tier-interpret", "解釋":"tier-interpret",
                     "實務見解":"tier-practice", "語料未涵蓋":"tier-gap" };
const tierTags = (html) => html.replace(/【(明文|解釋\/裁量|解釋|實務見解|語料未涵蓋)】/g,
  (_, k) => `<span class="tier ${TIER_CLASS[k]}">${k}</span>`);
// 裝置制約：把表格包進 overflow-x-auto，窄螢幕橫向捲動不爆版（Tailwind，無 media query）。
// 於 DOMPurify 之後包裹（div 為自有可信標記，class 為 Tailwind CDN 提供）。
const wrapTables = (html) => html.replace(/<table[\s\S]*?<\/table>/g,
  m => `<div class="overflow-x-auto -mx-1">${m}</div>`);
// 穩定全文渲染：marked → DOMPurify 淨化 → 表格 overflow 包裹 → 腳註上標 + 層級 chip
const md = (t) => tierTags(footnotes(wrapTables(DOMPurify.sanitize(marked.parse(stripCite(t), { breaks:true, gfm:true })))));

// 缺口③：串流途中把「尚未成形的尾段」切出來暫緩 render，避免閃現原始 markdown 符號。
//   - 未閉合 code fence（``` 數為奇數）→ 從最後一個 fence 起暫緩
//   - 未出現分隔列 |---| 的表格尾塊 → 整塊暫緩，待分隔列到齊才交給 marked
function splitUnstableTail(text){
  if (((text.match(/```/g) || []).length) % 2 === 1){
    const i = text.lastIndexOf("```");
    return [text.slice(0, i), text.slice(i)];
  }
  const lines = text.split("\n");
  let start = lines.length;
  for (let i = lines.length - 1; i >= 0; i--){ if (/^\s*\|.*/.test(lines[i])) start = i; else break; }
  if (start < lines.length){
    const block = lines.slice(start).join("\n");
    const hasSep = /\|\s*:?-{1,}:?\s*(\||$)/.test(block);   // GFM 表格分隔列
    if (!hasSep) return [lines.slice(0, start).join("\n"), block];
  }
  return [text, ""];
}
// 串流渲染：穩定段交給 md()，未成形尾段以淡墨純文字暫顯
function renderStream(el, fullText){
  const [stable, pending] = splitUnstableTail(stripCite(fullText));
  let html = md(stable);
  if (pending) html += `<span class="md-pending">${escapeHtml(pending)}</span>`;
  el.innerHTML = html;
}
const icons = () => lucide.createIcons();

/* —— 空狀態（方向2：漸進揭露）：領域 tag →（點）範例問題 —— */
const DOMAIN_EXAMPLES = {
  "個資": ["個資外洩要通報誰？期限多久？", "如何合法蒐集員工個資？", "違反個資法的罰則有哪些？"],
  "勞動": ["資遣費如何計算？", "加班費怎麼算？", "競業禁止條款有效嗎？"],
  "公司治理": ["內線交易何時可買賣股票？", "獨立董事有哪些義務？", "董事競業禁止規範？"],
  "公平交易": ["不實廣告的法律責任？", "聯合行為如何認定？"],
  "營業秘密": ["員工帶走客戶名單怎麼辦？", "營業秘密的保護要件？"],

async function renderStarters(){
  let manifest = state.capabilityManifest;
  if(!manifest){ try{ const r = await fetch("/api/capability"); if(r.ok){ manifest = await r.json(); state.capabilityManifest = manifest; } }catch{} }
  manifest = manifest || {};
  // 只顯示「有範例題」的領域（manifest 可能含「其他」等無範例的 catch-all → 過濾，避免空面板）
  let cats = (manifest.categories || []).filter(c => DOMAIN_EXAMPLES[c]);
  if(!cats.length) cats = Object.keys(DOMAIN_EXAMPLES);
  const dc = manifest.doc_type_counts || {};
  const scope = ["法條","施行細則","函釋","FAQ","判決"].filter(k=>dc[k]).join("・") || "法條・函釋・FAQ・判決";
  const box = document.createElement("div");
  box.className = "text-center py-8";
  box.innerHTML = `
    <div>
      <div class="font-display text-[22px] font-semibold mb-2" style="white-space:nowrap">企業法遵研究助理</div>
      <p class="font-body text-[14px] text-[var(--ink-70)] mb-5 max-w-md mx-auto" style="line-height:1.75">點一個領域看範例問題，或直接輸入。涵蓋 ${scope} 等。</p>
      <div id="dom-tags" class="flex flex-wrap justify-center gap-2 max-w-xl mx-auto"></div>
      <div id="dom-reveal" class="max-w-md mx-auto mt-4 text-left"></div>
    </div>`;
  // 競態防護：await /api/capability 期間使用者可能已送出問題（submit 移除的空狀態
  // 還沒注入）——對話已開始就不再注入，否則空狀態會出現在對話下方。
  if(state.answering || thread.querySelector("[data-answer]")) return;
  thread.appendChild(box);
  const tagsEl = box.querySelector("#dom-tags"), revealEl = box.querySelector("#dom-reveal");
  tagsEl.innerHTML = cats.map((c,i)=>`<button class="dom-tag${i===0?" on":""}" data-dom="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");
  const showDomain = (dom)=>{
    tagsEl.querySelectorAll(".dom-tag").forEach(t=> t.classList.toggle("on", t.dataset.dom===dom));
    const qs = DOMAIN_EXAMPLES[dom] || [];
    revealEl.innerHTML = `<div class="text-[10px] font-bold uppercase tracking-wide text-[var(--blood)] mb-2">${escapeHtml(dom)} — 範例問題</div>` +
      qs.map(q=>`<button class="exq starter block w-full text-left mb-2" data-q="${q.replace(/"/g,"&quot;")}">${escapeHtml(q)}</button>`).join("");
    revealEl.querySelectorAll(".starter").forEach(b=> b.addEventListener("click", ()=> submit(b.dataset.q)));
  };
  tagsEl.querySelectorAll(".dom-tag").forEach(t=> t.addEventListener("click", ()=> showDomain(t.dataset.dom)));
  if(cats.length) showDomain(cats[0]);
  icons();
}

/* —— 階段事件 → 步驟列推進（事件掛真實管線節點，見 astream_answer）—— */
function advanceStages(ui, evt){
  if(!ui.waitEl) return;
  const mark = (key, cls, extra) => {
    const row = ui.waitEl.querySelector(`[data-st="${key}"]`);
    if(!row) return;
    row.classList.remove("now"); row.classList.add(cls);
    if(cls === "done") row.querySelector(".st-ic").textContent = "✓";
    if(cls === "now") row.querySelector(".st-ic").textContent = "";
    if(extra) row.querySelector("span:last-child").textContent += extra;
  };
  if(evt.stage === "retrieved"){
    mark("retrieve", "done", ` — ${evt.law_count} 則`);
    mark("judgment", "done", ` — ${evt.judgment_count} 則`);
    mark("tier", "now");
  } else if(evt.stage === "generating"){
    mark("tier", "done");
    mark("gen", "now");
  }
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML.replaceAll('"',"&quot;"); }  // 補引號：雙引號屬性注入防護
function scrollDown(){ requestAnimationFrame(()=> document.querySelector("main").scrollTo({top:1e9, behavior:"smooth"})); }

/* —— 送出問題：SSE 串流 —— */
async function submit(text){
  if(state.answering) return;
  const q = (text||"").trim(); if(!q) return;
  document.querySelector("#thread > .text-center")?.remove(); // 移除空狀態
  state.answering = true; document.getElementById("send").disabled = true;
  document.getElementById("q").value = "";
  addQuestion(q);
  const ui = addAnswer();
  ui.isFollowup = !!state.previousResponseId;   // 本輪是否延續輪（缺口橫幅抑制用）
  let answerText = "";
  let gotFinal = false;

  // 等待UX：>12s 仍無首 token → 安撫文案＋停止鍵（NN/g 長等待要給逃生口）
  const aborter = new AbortController();
  ui.stopBtn?.addEventListener("click", () => aborter.abort());
  ui._reassureTimer = setTimeout(() => { ui.reassureEl?.classList.remove("hidden"); scrollDown(); }, 12000);

  // 處理單一 SSE frame（抽出成函式，讓串流結束後也能 flush buf 殘段）
  const handleFrame = (frame) => {
    const line = frame.split("\n").find(l=> l.startsWith("data:"));
    if(!line) return;
    const payload = line.slice(5).trim();
    if(!payload || payload === "[DONE]") return;
    let evt; try{ evt = JSON.parse(payload); }catch(e){ console.warn("SSE JSON 解析失敗，跳過此 frame：", e, payload); return; }
    if(evt.type === "stage"){
      advanceStages(ui, evt);
    } else if(evt.type === "delta"){
      if(ui.waitEl) ui.clearWait();          // 首 token：收合階段列＋骨架，串流即進度
      answerText += evt.text;
      // 缺口③：以 requestAnimationFrame 合併同影格多個 delta，並用 renderStream 平滑渲染
      if(!ui._raf){ ui._raf = requestAnimationFrame(()=>{ ui._raf = null; renderStream(ui.answerEl, answerText); scrollDown(); }); }
    } else if(evt.type === "final"){
      gotFinal = true;
      finalizeAnswer(ui, q, answerText, evt);
    }
  };

  try{
    const resp = await fetch("/api/ask/stream", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ question:q, previous_response_id: state.previousResponseId }),
      signal: aborter.signal,
    });
    if(!resp.ok || !resp.body) throw new Error("HTTP "+resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += decoder.decode(value, { stream:true });
      const frames = buf.split(/\r?\n\r?\n/); buf = frames.pop();
      for(const frame of frames) handleFrame(frame);
    }
    // 收尾：flush 殘留在 buf 的最後一個 frame（尾端無分隔符時不致遺失）
    if(buf.trim()) handleFrame(buf);
    // 降級兜底：串流結束卻從未收到 final（後端未送/連線中斷）。
    //   有累積文字 → 用既有文字完成渲染（含追問建議），並標 partial 誠實提示；
    //   完全沒文字 → 視為錯誤，交給 catch 顯示錯誤訊息。
    if(!gotFinal){
      if(answerText.trim()){
        finalizeAnswer(ui, q, answerText, { partial:true, citations:[], evidence:[] });
      }else{
        throw new Error("串流結束但無任何內容");
      }
    }
  }catch(err){
    if(!gotFinal){
      ui.clearWait();
      ui.answerEl.classList.remove("stream-caret");
      if(err && err.name === "AbortError"){
        // 使用者按「停止」：有部分文字 → 以 partial 收尾；無 → 中性訊息（非錯誤）
        if(answerText.trim()){
          finalizeAnswer(ui, q, answerText, { partial:true, citations:[], evidence:[] });
        }else{
          ui.answerEl.innerHTML = `<p class="text-[var(--ink-50)] flex items-center gap-1.5"><i data-lucide="circle-slash" class="icon-sm"></i> 已停止生成。</p>`;
          icons();
        }
      }else{
        ui.answerEl.innerHTML = `<p class="text-[var(--blood)] flex items-center gap-1.5"><i data-lucide="alert-circle" class="icon-sm"></i> 抱歉，發生錯誤，請稍後再試。</p>`;
        icons();
      }
    }
  }finally{
    state.answering = false; document.getElementById("send").disabled = false;
    ui.clearWait();
    ui.answerEl.classList.remove("stream-caret");
  }
}

/* —— 串流結束：渲染來源、引證、chips、feedback —— */
function finalizeAnswer(ui, question, answerText, evt){
  if(ui._raf){ cancelAnimationFrame(ui._raf); ui._raf = null; }   // 取消未完成的串流影格
  ui.clearWait?.();                                                // 等待面板若仍在（如 FAILEMPTY 無 delta）收掉
  ui.answerEl.classList.remove("stream-caret");
  state.previousResponseId = evt.response_id || state.previousResponseId;

  // 終結但無可見內容（response.failed，或推理耗盡預算未產出答案）：誠實顯示錯誤/截斷訊息，
  // 絕不留空白泡泡讓使用者誤以為「沒問題只是沒答」。此時不渲染來源/追問/feedback。
  const hasText = (answerText || "").trim().length > 0;
  if(evt.status === "failed" || !hasText){
    const msg = (evt.status === "failed")
      ? "回答過程發生錯誤，請重新提問。"
      : (evt.truncated ? "回答因長度上限被截斷、未能產出內容，請縮小問題範圍後重試。"
                       : "抱歉，未能產生回答，請重新提問。");
    ui.answerEl.innerHTML = `<p class="text-[var(--blood)] flex items-center gap-1.5"><i data-lucide="alert-circle" class="icon-sm"></i> ${msg}</p>`;
    icons();
    return;
  }

  // final：以後端 parse 後的權威答案渲染（已把 inline 引用標記轉成腳註 [^N]，依據欄不再空）；
  // 僅在降級/無 final 時才退回串流累積的原文。
  ui.answerEl.innerHTML = md(evt.answer != null ? evt.answer : answerText);

  // 確定性層級 badge（Layer-0，來自後端 classify_tier，可靠；取代內文逐句【明文】標記）
  const TIER_LABEL = { "明文":"明文規定", "解釋/裁量":"解釋/裁量", "實務見解":"實務見解", "語料未涵蓋":"語料未涵蓋" };
  if(evt.tier && TIER_LABEL[evt.tier]){
    const b = document.createElement("div");
    b.className = "tier-badge tier-" + ({ "明文":"explicit", "解釋/裁量":"interpret", "實務見解":"practice", "語料未涵蓋":"gap" }[evt.tier]);
    b.textContent = TIER_LABEL[evt.tier];
    ui.answerEl.before(b);
  }

  // 缺口提示：dual_retrieved 且有檢索到參考條文時，誠實標示超出精準涵蓋範圍
  // （完全無證據＝語料未涵蓋，靠答案內【語料未涵蓋】層級表達，不在此重複提示）
  // 延續輪（ui.isFollowup）不顯：延續句檢索常撈到無關來源、模型依指引改用前輪依據作答，
  // 此時「超出涵蓋範圍」是錯誤標示（code review Important #1）。
  if(!ui.isFollowup && (evt.evidence_mode || "") === "dual_retrieved" && (evt.evidence || []).length){
    const g = document.createElement("p");
    g.className = "text-[12px] mb-2 px-3 py-2 rounded-lg";
    g.style.cssText = "color:var(--blood); background:oklch(0.325 0.10 262 / 0.06); border:1px solid oklch(0.325 0.10 262 / 0.18); line-height:1.6";
    g.textContent = "本題超出語料直接涵蓋範圍，以下依相關度排列參考條文，未必逐句對應；建議查閱判決資料庫或諮詢法律顧問。";
    ui.answerEl.before(g);
  }

  // 誠實提示：回答被截斷（撞長度上限）或連線中斷導致不完整——法遵工具不可讓人誤以為是完整答案。
  if(evt.truncated || evt.partial){
    const notice = document.createElement("p");
    notice.className = "flex items-center gap-1.5 text-[12px] mt-1";
    notice.style.color = "var(--blood)";
    notice.innerHTML = `<i data-lucide="alert-triangle" class="icon-xs"></i> ` +
      (evt.partial ? "連線中斷，以上回答可能不完整，建議重新提問。"
                   : "回答因長度上限被截斷，建議縮小問題範圍或分次提問，並務必核對條文原文。");
    ui.answerEl.after(notice);
  }

  // 彙整來源列（去重）
  const cites = evt.citations || [];
  state.lastEvidence = evt.evidence || [];
  state.lastEvidenceMode = evt.evidence_mode || "retrieved";   // 缺口④：引用 vs 檢索參考
  if(cites.length){
    ui.sourcesEl.classList.remove("hidden");
    ui.sourcesEl.innerHTML =
      `<div class="flex items-center gap-1.5 text-[11px] uppercase tracking-wide text-[var(--ink-50)] font-semibold mb-1">
         <i data-lucide="library" class="icon-xs"></i> 來源 ${cites.length} 則 · 點擊展開引證</div>` +
      cites.map((c,i)=>`
        <div class="src-row" role="button" tabindex="0" aria-label="展開引證：${escapeHtml(c)}" data-filename="${escapeHtml(c)}">
          <span class="font-bold text-[var(--blood)] text-[12px]">${i+1}</span>
          <span class="font-body text-[13px] flex-1">${escapeHtml(c)}</span>
          <i data-lucide="panel-left-open" class="icon-xs text-[var(--ink-35)]"></i>
        </div>`).join("");
    ui.sourcesEl.querySelectorAll(".src-row").forEach(r=>{
      const open = ()=> openOffcanvas(r.dataset.filename);
      r.addEventListener("click", open);
      r.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
    });
    updateHamCount(state.lastEvidence.length || cites.length);
  }

  // feedback（需 query_log_id）
  if(evt.query_log_id != null){
    ui.fbEl.classList.remove("hidden");
    ui.fbEl.querySelectorAll(".fb-btn").forEach(b=>
      b.addEventListener("click", ()=> sendFeedback(ui.fbEl, evt.query_log_id, b.dataset.rate)));
  }

  icons();
  // 追問建議（獨立呼叫，不阻斷主流程）
  loadFollowups(ui.chipsEl, question, answerText);
}

/* —— suggestion chips —— */
async function loadFollowups(chipsEl, question, answer){
  try{
    const r = await fetch("/api/suggest", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ question, answer }) });
    if(!r.ok) return;
    const { questions } = await r.json();
    if(!questions || !questions.length) return;
    chipsEl.classList.remove("hidden");
    chipsEl.innerHTML =
      `<span class="w-full flex items-center gap-1.5 text-[11px] text-[var(--ink-50)] font-semibold">
         <i data-lucide="sparkles" class="icon-xs"></i> 你可能想追問</span>` +
      questions.map(q=>`<button class="chip followup" data-q="${escapeHtml(q)}"><i data-lucide="corner-down-right" class="icon-xs"></i>${escapeHtml(q)}</button>`).join("");
    chipsEl.querySelectorAll(".followup").forEach(b=> b.addEventListener("click", ()=> submit(b.dataset.q)));
    icons();
  }catch{ /* 追問失敗不影響答案 */ }
}

/* —— feedback —— */
async function sendFeedback(fbEl, queryLogId, rating){
  fbEl.querySelectorAll(".fb-btn").forEach(b=> b.classList.toggle("active", b.dataset.rate===rating));
  try{
    await fetch("/api/feedback", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ query_log_id: queryLogId, rating }) });
  }catch{ /* 靜默 */ }
}

/* —— offcanvas 控制 —— */
const scrim = document.getElementById("scrim");
const offcanvas = document.getElementById("offcanvas");
const ocBody = document.getElementById("oc-body");

function renderEvidence(activeFilename){
  if(!state.lastEvidence.length){
    ocBody.innerHTML = `<p class="font-body text-[14px] text-[var(--ink-50)] text-center py-8">尚無引證依據</p>`;
    return;
  }
  // 缺口④：誠實標示這批依據是「答案實際引用」還是「檢索參考」
  const isCited = (state.lastEvidenceMode || "").endsWith("cited");
  const modeLabel = isCited
    ? `<i data-lucide="link" class="icon-xs"></i> 答案引用來源`
    : `<i data-lucide="search" class="icon-xs"></i> 檢索參考（未必逐句引用）`;
  const header = `<div class="flex items-center gap-1.5 text-[11px] uppercase tracking-wide text-[var(--ink-50)] font-semibold mb-1">${modeLabel}</div>`;
  ocBody.innerHTML = header + state.lastEvidence.map((e,i)=>{
    const active = e.filename===activeFilename ? " active" : "";
    const score = (e.score!=null) ? Number(e.score).toFixed(2) : "";
    // 缺口⑥：有官方原文 url 就給真連結；無 url 才退回展開本地全文
    const action = e.url
      ? `<a href="${escapeHtml(e.url)}" target="_blank" rel="noopener noreferrer"
            class="open-link mt-2 inline-flex items-center gap-1 text-[11px] text-[var(--blood)]" data-filename="${escapeHtml(e.filename||"")}">
           <i data-lucide="external-link" class="icon-xs"></i> 開啟官方原文</a>`
      : `<button class="open-full mt-2 inline-flex items-center gap-1 text-[11px] text-[var(--blood)]" data-filename="${escapeHtml(e.filename||"")}" data-file-id="${escapeHtml(e.file_id||"")}">
           <i data-lucide="external-link" class="icon-xs"></i> 展開原文全文</button>
         <div class="full-text legal-pre hidden font-body text-[13px] leading-relaxed text-[var(--ink-70)] mt-2 pt-2 border-t" style="border-color:var(--ink-12)"></div>`;
    return `
      <div class="evi-card${active}" data-filename="${escapeHtml(e.filename||"")}" data-i="${i}">
        <div class="flex items-center gap-1.5 text-[12px] font-semibold">
          <i data-lucide="file-text" class="icon-xs"></i>
          <span class="text-[var(--blood)] flex-1 truncate">${escapeHtml(e.filename||"")}</span>
          <span class="text-[10px] text-[var(--ink-50)] font-normal">${score}</span>
        </div>
        <div class="legal-pre evi-snippet font-body text-[13px] leading-relaxed text-[var(--ink-70)] mt-2">${escapeHtml(e.text||"")}</div>
        ${action}
      </div>`;
  }).join("");
  ocBody.querySelectorAll(".open-full").forEach(b=>
    b.addEventListener("click", ()=> openFullText(b)));
  icons();
  const act = ocBody.querySelector(".evi-card.active");
  if(act) act.scrollIntoView({ block:"nearest" });
}

/* —— 抽屜內展開原文全文 —— */
async function openFullText(btn){
  const card = btn.closest(".evi-card");
  const box = card.querySelector(".full-text");
  if(!box.classList.contains("hidden")){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  if(box.dataset.loaded === "1") return;   // toggle 快取：再展開不重打 API
  box.textContent = "載入中…";
  // 判決等無本地檔的來源：優先以 file_id 自 vector store 取回全文（/api/source_vs）；
  // 無 file_id（舊資料/法條）退回本地 /api/source。兩路皆失敗 → 友善降級保留 snippet。
  const fid = btn.dataset.fileId;
  const endpoints = [];
  if(fid) endpoints.push("/api/source_vs/"+encodeURIComponent(fid));
  endpoints.push("/api/source/"+encodeURIComponent(btn.dataset.filename));
  for(const ep of endpoints){
    try{
      const r = await fetch(ep);
      if(!r.ok) continue;
      const { text } = await r.json();
      if(text){ box.textContent = text; box.dataset.loaded = "1"; return; }
    }catch{ /* 換下一個端點 */ }
  }
  box.textContent = "原文尚未建立索引，請參考上方摘要。";
}

function openOffcanvas(activeFilename){ renderEvidence(activeFilename); scrim.classList.add("open"); offcanvas.classList.add("open"); }
function closeOffcanvas(){ scrim.classList.remove("open"); offcanvas.classList.remove("open"); }
function updateHamCount(n){ const c=document.getElementById("ham-count"); if(n>0){ c.textContent=n; c.classList.remove("hidden"); c.classList.add("flex"); } }

document.getElementById("ham").addEventListener("click", ()=>
  offcanvas.classList.contains("open") ? closeOffcanvas() : openOffcanvas());
document.getElementById("oc-close").addEventListener("click", closeOffcanvas);
scrim.addEventListener("click", closeOffcanvas);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeOffcanvas(); });

// 點答案內的上標引用 → 開 offcanvas，高亮對應來源（依序號對到 evidence）
thread.addEventListener("click", e=>{
  const ref = e.target.closest(".cite-ref");
  if(!ref) return;
  e.preventDefault();
  const idx = parseInt(ref.dataset.ref, 10) - 1;
  const ev = state.lastEvidence[idx];
  openOffcanvas(ev ? ev.filename : null);
});

document.getElementById("ask-form").addEventListener("submit", e=>{ e.preventDefault(); submit(document.getElementById("q").value); });
document.getElementById("new-chat").addEventListener("click", ()=>{
  state.previousResponseId=null; state.lastEvidence=[]; thread.innerHTML=""; closeOffcanvas();
  document.getElementById("ham-count").classList.add("hidden"); renderStarters();
});

/* init */
renderStarters(); icons();
</script>
